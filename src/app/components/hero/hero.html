<section class="hero">
  <div class="hero__photo"></div>
  <div class="hero__scrim"></div>

  <span class="hero__mark" aria-hidden="true">
    <span class="hero__mark-l">L</span><span class="hero__mark-s">S</span>
    <span class="hero__mark-needle"></span>
  </span>

  <div class="hero__content">
    <span class="hero__eyebrow reveal" appRevealOnScroll [appRevealOnScrollDelay]="0"
      >FDA-recognized &middot; Permanent hair removal</span
    >
    <h1 class="hero__headline reveal" appRevealOnScroll [appRevealOnScrollDelay]="90">
      The last<br />hair-removal<br />appointment.
    </h1>
    <p class="hero__subtext reveal" appRevealOnScroll [appRevealOnScrollDelay]="180">
      One-on-one electrolysis, by appointment only. No lasers, no shortcuts.
    </p>
    <div class="hero__actions reveal" appRevealOnScroll [appRevealOnScrollDelay]="260">
      <a href="https://luxuryskinelectrolysis.booksy.com/a/" target="_blank" rel="noopener" class="btn btn-milk">Book Now</a>
      <a href="#pricing" class="hero__link">See pricing</a>
    </div>
  </div>
</section>
