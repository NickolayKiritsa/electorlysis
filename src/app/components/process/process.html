<section class="process" id="process">
  <div class="process__head">
    <span class="process__eyebrow">How It Works</span>
    <h2>One cycle at a time.</h2>
    <p>Hair grows in cycles — that's why treatment does too.</p>
  </div>

  <div class="curtain" role="tablist">
    @for (step of steps; track step.number; let i = $index) {
      <div
        class="curtain__panel"
        [class.is-active]="activeIndex() === i"
        (mouseenter)="setActive(i)"
        (focus)="setActive(i)"
        (click)="setActive(i)"
        tabindex="0"
        role="tab"
        [attr.aria-selected]="activeIndex() === i">

        <!-- Узкий "корешок" (виден всегда) -->
        <div class="curtain__spine">
          <span class="curtain__number">{{ step.number }}</span>
          <span class="curtain__spine-title">{{ step.label }}</span>
        </div>

        <!-- Контентная часть (раскрывается плавно) -->
        <div class="curtain__content">
          <div class="curtain__inner">
            <div class="curtain__meta">
              <span class="curtain__badge">{{ step.phase }}</span>
              @if (step.duration) {
                <span class="curtain__duration">{{ step.duration }}</span>
              }
            </div>

            <h3 class="curtain__title">{{ step.label }}</h3>
            <p class="curtain__desc">{{ step.desc }}</p>

            <div class="curtain__indicator">
              <span class="curtain__progress-track">
                <span class="curtain__progress-fill"></span>
              </span>
            </div>
          </div>
        </div>

      </div>
    }
  </div>
</section>
