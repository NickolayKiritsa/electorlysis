<section class="process" id="process">
  <div class="process__head reveal" appRevealOnScroll>
    <span class="process__eyebrow">How It Works</span>
    <h2>One cycle at a time.</h2>
    <p>Hair grows in cycles — that's why treatment does too.</p>
  </div>

  <div class="process__timeline">
    @for (step of steps; track step.number; let last = $last, i = $index) {
      <div class="process__row reveal" appRevealOnScroll [appRevealOnScrollDelay]="i * 70">
        <div class="process__rail">
          <span class="process__circle">{{ step.number }}</span>
          @if (!last) {
            <span class="process__line" aria-hidden="true"></span>
          }
        </div>
        <div class="process__body">
          <span class="process__label">{{ step.label }}</span>
          <p class="process__desc">{{ step.desc }}</p>
        </div>
      </div>
    }
  </div>
</section>
