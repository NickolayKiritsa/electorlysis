<section class="visit" id="visit">
  <div class="visit__grid">

    <div class="visit__card reveal" appRevealOnScroll>
      <h2>Book Your Visit</h2>
      <p class="visit__subtext">See real-time availability and book your consultation instantly &mdash; no waiting on a callback.</p>
      <a href="https://luxuryskinelectrolysis.booksy.com/a/" target="_blank" rel="noopener" class="visit__submit visit__submit--link">Book on Booksy</a>
      <a href="tel:+12532698989" class="visit__phone">or call (253) 269-8989</a>
    </div>

    <div class="visit__map reveal" appRevealOnScroll [appRevealOnScrollDelay]="120">
      <div class="map">
        <iframe
          class="map__frame"
          title="Map showing Luxury Skin Electrolysis at 1103 A St NE, Auburn, WA 98002"
          src="https://www.google.com/maps?q=1103+A+St+NE,+Auburn,+WA+98002&output=embed"
          loading="lazy"
          referrerpolicy="no-referrer-when-downgrade"
        ></iframe>
      </div>

      <div class="location-card">
        <div class="location-card__brand">
          <span class="location-card__mark" aria-hidden="true">
            <span>L</span><span>S</span>
            <span class="location-card__mark-needle"></span>
          </span>
          <div>
            <div class="location-card__name">Luxury Skin Electrolysis</div>
            <div class="location-card__category">Electrolysis Studio &middot; By Appointment</div>
          </div>
        </div>
        <div class="location-card__address">1103 A St NE, Auburn, WA 98002</div>
        <div class="location-card__actions">
          <a
            class="btn btn-ink location-card__btn"
            href="https://www.google.com/maps/search/?api=1&query=1103+A+St+NE%2C+Auburn%2C+WA+98002"
            target="_blank"
            rel="noopener"
            >Directions</a
          >
          <a class="location-card__btn location-card__btn--ghost" href="tel:+12532698989">Call</a>
          <button type="button" class="location-card__btn location-card__btn--ghost" (click)="copyAddress()">
            {{ copied() ? 'Copied' : 'Copy address' }}
          </button>
        </div>
      </div>
    </div>

  </div>
</section>
